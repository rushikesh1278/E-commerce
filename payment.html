<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Payment Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:#fff;
}

header{
    background:#000;
    color:gold;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.box{
    background:#222;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(255,215,0,0.3);
}

h2{
    color:gold;
    margin-bottom:20px;
}

.car-info p{
    margin:12px 0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

input, select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:5px;
    outline:none;
    font-size:15px;
}

.row{
    display:flex;
    gap:15px;
}

.row div{
    flex:1;
}

button{
    width:100%;
    padding:15px;
    background:gold;
    color:black;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
    margin-top:25px;
    font-weight:bold;
}

button:hover{
    background:#ffcc00;
}

footer{
    text-align:center;
    padding:20px;
    background:#000;
    margin-top:30px;
}

@media(max-width:768px){
.container{
grid-template-columns:1fr;
}
}
</style>

</head>
<body>

<header>
<h1>Luxury Car Payment</h1>
</header>

<div class="container">

<!-- Order Summary -->
<div class="box">

<h2>Order Summary</h2>

<div class="car-info">

<p><strong>Car:</strong> Lamborghini Revuelto</p>

<p><strong>Color:</strong> Red</p>

<p><strong>Engine:</strong> 6.5L V12 Hybrid</p>

<p><strong>Horsepower:</strong> 1001 HP</p>

<p><strong>Price:</strong> $608,000</p>

<p><strong>Registration:</strong> $2,000</p>

<p><strong>Insurance:</strong> $8,000</p>

<hr style="margin:20px 0;">

<h2>Total: $618,000</h2>

</div>

</div>

<!-- Payment Form -->
<div class="box">

<h2>Payment Details</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>

<label>Email</label>
<input type="email" placeholder="Enter email" required>

<label>Phone Number</label>
<input type="tel" placeholder="Enter phone number" required>

<label>Payment Method</label>
<select required>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Net Banking</option>
<option>UPI</option>
</select>

<label>Card Number</label>
<input type="text" placeholder="1234 5678 9012 3456">

<div class="row">

<div>
<label>Expiry Date</label>
<input type="text" placeholder="MM/YY">
</div>

<div>
<label>CVV</label>
<input type="password" placeholder="123">
</div>

</div>

<label>Billing Address</label>
<input type="text" placeholder="Enter Address">

<button type="submit">
Complete Payment
</button>

</form>

</div>

</div>

<footer>
© 2026 Luxury Car Showroom | Secure Payment
</footer>

</body>
</html>
